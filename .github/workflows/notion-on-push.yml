name: PICART Push to Notion

on:
  push:

permissions:
  contents: read

jobs:
  log-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pushed revision and Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Notion logger dependency
        run: python -m pip install 'requests>=2.32'
      - name: Log this push to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: python tools/notion_push_log.py
